<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Writer Room Simulator</title>
  <style>
    :root {
      --bg: #07080c;
      --panel: rgba(9, 12, 18, .88);
      --panel-solid: #111722;
      --line: rgba(221, 232, 255, .14);
      --text: #f7f8fb;
      --muted: #aeb7c7;
      --accent: #62d8ef;
      --accent-2: #ffcc6a;
      --ok: #84e28f;
      --warn: #ff9870;
      --danger: #ff6f8d;
      --glass: rgba(13, 18, 28, .66);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 10%, rgba(98, 216, 239, .2), transparent 28%),
        radial-gradient(circle at 86% 18%, rgba(255, 204, 106, .14), transparent 24%),
        linear-gradient(145deg, #06070b 0%, #101827 52%, #07080c 100%);
    }

    button {
      min-width: 74px;
      border: 1px solid var(--line);
      background: rgba(18, 24, 35, .92);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 760;
    }

    button:hover { border-color: rgba(98, 216, 239, .72); background: rgba(28, 38, 54, .95); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .app {
      display: grid;
      grid-template-rows: 68px minmax(0, 1fr) 86px;
      height: 100vh;
    }

    .topbar {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 338px;
      gap: 16px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 7, 11, .82);
      backdrop-filter: blur(18px);
      z-index: 10;
    }

    .brand-title { font-size: 15px; font-weight: 850; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }

    .timeline {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
    }

    .stage {
      min-width: 0;
      border: 1px solid var(--line);
      background: rgba(17, 24, 35, .8);
      border-radius: 8px;
      padding: 9px 10px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage.active {
      color: var(--text);
      border-color: rgba(98, 216, 239, .76);
      background: linear-gradient(180deg, rgba(18, 62, 77, .9), rgba(19, 30, 43, .88));
      box-shadow: 0 0 24px rgba(98, 216, 239, .12) inset;
    }

    .controls { display: flex; justify-content: flex-end; gap: 8px; }
    .controls .manager-action { border-color: rgba(255, 204, 106, .48); color: #ffe2a0; }

    .main {
      display: grid;
      grid-template-columns: 268px minmax(0, 1fr) 318px;
      min-height: 0;
    }

    .sidebar, .inspector {
      min-height: 0;
      overflow: auto;
      padding: 15px;
      background: rgba(8, 10, 15, .76);
      backdrop-filter: blur(14px);
    }

    .sidebar { border-right: 1px solid var(--line); }
    .inspector { border-left: 1px solid var(--line); }

    .panel-title {
      margin: 0 0 11px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 820;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .artifact, .issue-card, .stat-card {
      border: 1px solid var(--line);
      background: rgba(18, 25, 37, .78);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, .18);
    }

    .artifact strong, .issue-card strong, .stat-card strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .artifact span, .issue-card span, .stat-card span { color: var(--muted); font-size: 12px; }

    .workspace {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .scene-shell {
      position: relative;
      width: min(100%, calc((100vh - 172px) * 1.777));
      max-width: 1380px;
      aspect-ratio: 1672 / 941;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 32px 95px rgba(0, 0, 0, .48), 0 0 0 1px rgba(255,255,255,.12);
      background: #0c1119;
    }

    .scene-bg, .scene-foreground {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      pointer-events: none;
    }

    .scene-bg { z-index: 0; }
    .scene-foreground { z-index: 660; opacity: .88; }

    .hotspot {
      position: absolute;
      z-index: 4;
      width: 9.8%;
      height: 6.2%;
      border: 1px solid rgba(98,216,239,.34);
      border-radius: 8px;
      background: rgba(6, 14, 20, .28);
      box-shadow: 0 0 22px rgba(98,216,239,.12) inset;
      transform: skewX(-18deg) rotate(-2deg);
      pointer-events: none;
    }

    .agent {
      position: absolute;
      left: calc(var(--x) * 1%);
      top: calc(var(--y) * 1%);
      width: var(--w);
      transform: translate(-50%, -88%);
      transition: left .82s cubic-bezier(.2,.8,.2,1), top .82s cubic-bezier(.2,.8,.2,1), filter .18s ease;
      cursor: pointer;
      isolation: isolate;
    }

    .agent::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 4%;
      width: 56%;
      height: 9%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,0,0,.36), transparent 72%);
      z-index: -2;
    }

    .agent::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 6%;
      width: 48%;
      height: 9%;
      transform: translateX(-50%);
      border: 2px solid rgba(98, 216, 239, .55);
      border-radius: 50%;
      opacity: .68;
      box-shadow: 0 0 20px rgba(98, 216, 239, .32);
    }

    .agent.selected::after { border-color: var(--accent-2); box-shadow: 0 0 24px rgba(255, 204, 106, .44); opacity: 1; }
    .agent:hover { filter: brightness(1.12); }

    .agent-sprite {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 18px 18px rgba(0,0,0,.34));
      transform-origin: 50% 100%;
    }

    .agent.working .agent-sprite { animation: focusPulse 1.4s ease-in-out infinite; }
    .agent.meeting .agent-sprite { animation: talkPulse 1.1s ease-in-out infinite; }
    .agent.moving .agent-sprite { animation: walkCycle .72s ease-in-out infinite; }
    .agent.done::after { border-color: var(--ok); box-shadow: 0 0 24px rgba(132, 226, 143, .42); }
    .agent.reviewing::after { border-color: var(--accent-2); }
    .agent.writing::after, .agent.thinking::after { border-color: var(--accent); }

    @keyframes focusPulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    @keyframes talkPulse {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(1.5deg); }
    }

    @keyframes walkCycle {
      0%, 100% { transform: translate(0, 0) rotate(-1deg); }
      50% { transform: translate(2px, -3px) rotate(1.5deg); }
    }

    .agent-label {
      position: absolute;
      left: 50%;
      bottom: -24px;
      transform: translateX(-50%);
      width: max-content;
      max-width: 148px;
      padding: 5px 8px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(6, 9, 14, .86);
      box-shadow: 0 10px 24px rgba(0,0,0,.28);
      color: var(--text);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-pill {
      position: absolute;
      right: -4px;
      top: 14%;
      min-width: 26px;
      height: 22px;
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(7, 10, 15, .88);
      color: var(--accent);
      font-size: 10px;
      font-weight: 820;
      box-shadow: 0 10px 22px rgba(0,0,0,.28);
    }

    .progress-ring {
      position: absolute;
      left: 50%;
      bottom: 3%;
      width: 50%;
      height: 9%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: conic-gradient(var(--accent) calc(var(--p) * 1%), rgba(255,255,255,.14) 0);
      opacity: .42;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      left: 50%;
      top: -30px;
      transform: translateX(-50%);
      width: max-content;
      max-width: 180px;
      padding: 7px 9px;
      border: 1px solid rgba(98,216,239,.4);
      border-radius: 8px;
      background: rgba(7, 11, 17, .88);
      color: var(--text);
      font-size: 11px;
      line-height: 1.3;
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }

    .agent.active-bubble .bubble { opacity: 1; }

    .work-badge {
      position: absolute;
      left: 50%;
      top: -22px;
      display: flex;
      align-items: center;
      gap: 4px;
      transform: translateX(-50%);
      padding: 4px 7px;
      border: 1px solid rgba(98,216,239,.36);
      border-radius: 999px;
      background: rgba(5, 8, 12, .86);
      box-shadow: 0 10px 24px rgba(0,0,0,.28);
      color: var(--text);
      font-size: 10px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .agent.selected .work-badge, .agent.working .work-badge, .agent.meeting .work-badge, .agent.done .work-badge { opacity: 1; }

    .work-badge i {
      display: block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotFlow 1s ease-in-out infinite;
    }

    .work-badge i:nth-child(3) { animation-delay: .15s; }
    .work-badge i:nth-child(4) { animation-delay: .3s; }
    .agent.done .work-badge i { background: var(--ok); animation: none; }
    .agent.reviewing .work-badge i { background: var(--accent-2); }
    .agent.meeting .work-badge i { background: var(--danger); }

    @keyframes dotFlow {
      0%, 100% { opacity: .35; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-2px); }
    }

    .footer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 356px;
      gap: 14px;
      border-top: 1px solid var(--line);
      background: rgba(5, 7, 11, .84);
      padding: 12px 16px;
      z-index: 10;
    }

    .event-log { overflow: auto; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .event-line { margin-bottom: 4px; }
    .event-line strong { color: var(--text); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-content: center;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 9px;
      background: rgba(17, 24, 35, .82);
      font-size: 12px;
    }

    .metric b { display: block; font-size: 18px; margin-bottom: 2px; }
    .metric span { color: var(--muted); }

    .progress {
      height: 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(5, 8, 12, .72);
      margin: 8px 0 12px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .25s ease;
    }

    .manager-queue { margin-top: 18px; }
    .manager-card { border-color: rgba(255, 204, 106, .28); }
    .manager-actions { display: grid; gap: 8px; margin-top: 10px; }
    .manager-actions button { width: 100%; color: #ffe2a0; border-color: rgba(255, 204, 106, .42); }
    .queue-item strong { color: #ffe2a0; }

    @media (max-width: 1180px) {
      .topbar { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; }
      .main { grid-template-columns: 220px minmax(0, 1fr); }
      .inspector { display: none; }
      .timeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .scene-shell { width: 100%; }
    }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; grid-template-rows: auto minmax(520px, 1fr) auto; }
      .main { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .workspace { min-height: 520px; padding: 10px; }
      .footer { grid-template-columns: 1fr; }
      .agent-label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="brand-title">Writer Room Simulator</div>
        <div class="brand-sub">AI 编剧室实时调度台</div>
      </div>
      <div class="timeline" id="timeline"></div>
      <div class="controls">
        <button id="playBtn" type="button">Play</button>
        <button id="stepBtn" type="button">Step</button>
        <button id="managerBtn" class="manager-action" type="button">Dispatch</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>
    </header>

    <main class="main">
      <aside class="sidebar">
        <h2 class="panel-title">Artifacts</h2>
        <div id="artifacts"></div>
        <h2 class="panel-title" style="margin-top:18px">Review Board</h2>
        <div id="issues"></div>
        <div class="manager-queue">
          <h2 class="panel-title">Manager Queue</h2>
          <div id="managerQueue"></div>
        </div>
      </aside>

      <section class="workspace" aria-label="2.5D writer room office">
        <div class="scene-shell" id="scene">
          <img class="scene-bg" src="../../../../assets/writer-room/office-bg.png" alt="" />
          <div class="hotspot" style="left:24%;top:42%;"></div>
          <div class="hotspot" style="left:51%;top:59%;width:15%;height:8%;"></div>
          <div class="hotspot" style="left:74%;top:42%;width:16%;height:7%;"></div>
          <img class="scene-foreground" src="../../../../assets/writer-room/office-foreground.png" alt="" />
        </div>
      </section>

      <aside class="inspector">
        <h2 class="panel-title">Agent Inspector</h2>
        <div id="inspector"></div>
      </aside>
    </main>

    <footer class="footer">
      <div class="event-log" id="eventLog"></div>
      <div class="metrics">
        <div class="metric"><b id="metricStep">0</b><span>Step</span></div>
        <div class="metric"><b id="metricDone">0</b><span>Done</span></div>
        <div class="metric"><b id="metricIssues">0</b><span>Issues</span></div>
        <div class="metric"><b id="metricScore">--</b><span>Score</span></div>
      </div>
    </footer>
  </div>

  <script>
    const assetBase = "../../../../assets/writer-room/";
    const sprites = {
      male: {
        idle: assetBase + "agent-male-idle.png",
        standing: assetBase + "agent-male-standing.png",
        sitting: assetBase + "agent-male-sitting.png",
        walking: assetBase + "agent-male-walking.png",
        talking: assetBase + "agent-male-talking.png"
      },
      female: {
        idle: assetBase + "agent-female-standing.png",
        standing: assetBase + "agent-female-standing.png",
        sitting: assetBase + "agent-female-sitting.png",
        walking: assetBase + "agent-female-walking.png",
        talking: assetBase + "agent-female-talking.png"
      }
    };

    const stages = ["Brief", "Outline", "Character", "Script", "Review", "Rewrite", "Eval"];
    const agents = {
      "showrunner-agent": { name: "林总编", role: "总编剧", level: "L4 Principal", model: "male", pose: "standing", x: 47, y: 46, home: [47, 46], width: "3.2%", task: "确定项目 brief" },
      "story-architect-agent": { name: "周结构", role: "故事结构师", level: "L3 Senior", model: "female", pose: "sitting", x: 31, y: 50, home: [31, 50], width: "4.5%", task: "拆解 beat-sheet" },
      "character-agent": { name: "许人物", role: "人物设计师", level: "L2 Junior", model: "female", pose: "standing", x: 24, y: 63, home: [24, 63], width: "2.8%", task: "生成角色弧线" },
      "scene-agent": { name: "沈场景", role: "场景设计师", level: "L2 Junior", model: "male", pose: "sitting", x: 31, y: 80, home: [31, 80], width: "4.4%", task: "设计可拍场景" },
      "dialogue-agent": { name: "白对白", role: "对白编剧", level: "L3 Senior", model: "female", pose: "sitting", x: 74, y: 51, home: [74, 51], width: "4.4%", task: "写 script_v01" },
      "script-doctor-agent": { name: "顾医生", role: "剧本医生", level: "L3 Senior", model: "male", pose: "standing", x: 62, y: 59, home: [62, 59], width: "3.1%", task: "审查动机与冲突" },
      "rewrite-agent": { name: "叶改写", role: "改写编剧", level: "L2 Junior", model: "female", pose: "sitting", x: 84, y: 59, home: [84, 59], width: "4.4%", task: "根据 critique 改写" },
      "continuity-agent": { name: "陆连续", role: "连续性审核", level: "L2 Junior", model: "male", pose: "standing", x: 82, y: 45, home: [82, 45], width: "3.1%", task: "检查角色与场景连续" },
      "script-evaluator-agent": { name: "秦评分", role: "剧本评分员", level: "L2 Junior", model: "female", pose: "standing", x: 56, y: 64, home: [56, 64], width: "2.7%", task: "生成 script-score" },
      "memory-librarian": { name: "孟档案", role: "记忆管理员", level: "L3 Senior", model: "male", pose: "sitting", x: 85, y: 72, home: [85, 72], width: "4.2%", task: "归档经验" },
      "learning-evolution-agent": { name: "韩进化", role: "学习进化代理", level: "L2 Junior", model: "female", pose: "standing", x: 51, y: 50, home: [51, 50], width: "2.7%", task: "提出 skill 改进" }
    };

    const events = [
      { stage: 0, agent: "showrunner-agent", status: "writing", pose: "talking", progress: 18, artifact: "brief/brief.json", log: "总编剧在白板前创建项目 brief" },
      { stage: 1, agent: "story-architect-agent", status: "thinking", pose: "sitting", progress: 31, artifact: "script/beat-sheet.json", handoff: true, log: "故事结构师拆出 6 个 beat，并交付给经理复核" },
      { stage: 2, agent: "character-agent", status: "writing", pose: "talking", progress: 42, artifact: "bible/characters.json", handoff: true, log: "人物设计师生成角色 bible，并交付给经理复核" },
      { stage: 3, agent: "dialogue-agent", status: "writing", pose: "sitting", progress: 58, artifact: "script/script_v01.md", handoff: true, log: "对白编剧完成第一版剧本，并交付给经理复核" },
      { stage: 4, agent: "script-doctor-agent", status: "reviewing", pose: "standing", progress: 66, issue: "主角推门动机不足", handoff: true, log: "剧本医生发现动机和冲突强度不足，并把问题交给经理" },
      { stage: 4, agent: "script-doctor-agent", status: "meeting", pose: "talking", move: [67, 62], with: "rewrite-agent", log: "剧本医生前往改写工位交接 critique" },
      { stage: 5, agent: "rewrite-agent", status: "writing", pose: "sitting", progress: 78, artifact: "script/script_v02_rewritten.md", handoff: true, log: "改写编剧加强私人诱因和外部压力，并交付经理验收" },
      { stage: 5, agent: "continuity-agent", status: "reviewing", pose: "standing", progress: 84, artifact: "reports/continuity-report.json", handoff: true, log: "连续性审核通过围巾和暖光锚点，并交付经理验收" },
      { stage: 6, agent: "script-evaluator-agent", status: "reviewing", pose: "talking", progress: 92, score: 78, artifact: "reports/script-score.json", handoff: true, log: "评分员给出 pass 建议，并交付经理最终决策" },
      { stage: 6, agent: "memory-librarian", status: "done", pose: "sitting", progress: 97, artifact: "memory/current-state.md", log: "记忆管理员归档失败模式和成功修改" },
      { stage: 6, agent: "learning-evolution-agent", status: "done", pose: "standing", progress: 100, artifact: "memory/evolution-notes.md", log: "进化代理提出 character-arc skill 改进" }
    ];

    let step = -1;
    let playing = false;
    let timer = null;
    let selectedAgent = "showrunner-agent";
    let score = null;
    let dispatchCount = 0;
    let managerDecision = "等待子 agent 交付";
    const artifacts = [];
    const issues = [];
    const managerQueue = [];
    const agentState = Object.fromEntries(Object.entries(agents).map(([id, agent]) => [id, { ...agent, status: "idle", progress: 0, handoff: "尚未交付", currentTask: agent.task }]));

    const scene = document.getElementById("scene");
    const timeline = document.getElementById("timeline");
    const inspector = document.getElementById("inspector");
    const artifactBox = document.getElementById("artifacts");
    const issuesBox = document.getElementById("issues");
    const managerQueueBox = document.getElementById("managerQueue");
    const logBox = document.getElementById("eventLog");

    function init() {
      stages.forEach((name, index) => {
        const node = document.createElement("div");
        node.className = "stage";
        node.id = `stage-${index}`;
        node.textContent = name;
        timeline.appendChild(node);
      });

      Object.entries(agentState).forEach(([id, agent]) => {
        const node = document.createElement("div");
        node.className = "agent";
        node.id = id;
        node.style.setProperty("--x", agent.x);
        node.style.setProperty("--y", agent.y);
        node.style.setProperty("--w", agent.width);
        node.style.setProperty("--p", 0);
        node.innerHTML = `
          <div class="bubble">${agent.task}</div>
          <div class="work-badge"><span>idle</span><i></i><i></i><i></i></div>
          <img class="agent-sprite" alt="${agent.name}" src="${sprites[agent.model][agent.pose]}" />
          <div class="progress-ring"></div>
          <div class="status-pill">idle</div>
          <div class="agent-label">${agent.name}</div>`;
        node.addEventListener("click", () => { selectedAgent = id; render(); });
        scene.appendChild(node);
      });

      document.getElementById("playBtn").addEventListener("click", togglePlay);
      document.getElementById("stepBtn").addEventListener("click", nextStep);
      document.getElementById("managerBtn").addEventListener("click", () => managerDispatch(selectedAgent));
      document.getElementById("resetBtn").addEventListener("click", reset);
      render();
    }

    function togglePlay() {
      playing = !playing;
      document.getElementById("playBtn").textContent = playing ? "Pause" : "Play";
      if (playing) timer = setInterval(nextStep, 1250);
      else clearInterval(timer);
    }

    function nextStep() {
      if (step >= events.length - 1) {
        if (playing) togglePlay();
        return;
      }
      step += 1;
      applyEvent(events[step]);
      render();
    }

    function reset() {
      clearInterval(timer);
      playing = false;
      document.getElementById("playBtn").textContent = "Play";
      step = -1;
      artifacts.length = 0;
      issues.length = 0;
      score = null;
      dispatchCount = 0;
      managerDecision = "等待子 agent 交付";
      managerQueue.length = 0;
      Object.entries(agents).forEach(([id, agent]) => Object.assign(agentState[id], { ...agent, status: "idle", progress: 0, x: agent.home[0], y: agent.home[1], pose: agent.pose, handoff: "尚未交付", currentTask: agent.task }));
      logBox.innerHTML = "";
      render();
    }

    function addLog(message, prefix = "") {
      const line = document.createElement("div");
      line.className = "event-line";
      line.innerHTML = `<strong>${prefix || String(step + 1).padStart(2, "0")}</strong> ${message}`;
      logBox.prepend(line);
    }

    function applyEvent(event) {
      const agent = agentState[event.agent];
      agent.status = event.status;
      agent.progress = event.progress || agent.progress;
      agent.pose = event.pose || agent.pose;
      agent.currentTask = event.log;
      if (event.move) [agent.x, agent.y] = event.move;
      else [agent.x, agent.y] = agent.home;
      selectedAgent = event.agent;
      if (event.artifact && !artifacts.includes(event.artifact)) artifacts.push(event.artifact);
      if (event.issue && !issues.includes(event.issue)) issues.push(event.issue);
      if (event.score) score = event.score;
      if (event.handoff || event.artifact || event.issue) {
        const payload = event.artifact || event.issue || event.log;
        agent.handoff = `已交付给 ${agentState["showrunner-agent"].name}`;
        managerDecision = event.issue ? `经理收到问题：${event.issue}` : `经理收到产物：${payload}`;
        managerQueue.unshift({ from: agent.name, role: agent.role, payload, decision: event.issue ? "待派发返工" : "待验收" });
        if (managerQueue.length > 5) managerQueue.pop();
      }
      addLog(event.log);
    }

    function managerDispatch(requestedAgentId) {
      const targetId = requestedAgentId && requestedAgentId !== "showrunner-agent" ? requestedAgentId : "rewrite-agent";
      const target = agentState[targetId];
      const manager = agentState["showrunner-agent"];
      dispatchCount += 1;
      const currentDispatch = dispatchCount;
      selectedAgent = targetId;
      manager.status = "meeting";
      manager.pose = "talking";
      manager.progress = Math.max(manager.progress, 72);
      target.status = "meeting";
      target.pose = "talking";
      target.x = 50;
      target.y = 52;
      target.progress = Math.max(target.progress, 62);
      target.currentTask = issues.length ? "根据经理意见继续修正问题" : "根据经理意见继续补齐任务";
      target.handoff = "经理已退回并派发继续工作";
      managerDecision = `${manager.name} 派发继续工作给 ${target.name}`;
      managerQueue.unshift({ from: manager.name, role: manager.role, payload: `manager/rework-order-${currentDispatch}.json`, decision: `派发给 ${target.name}` });
      if (managerQueue.length > 5) managerQueue.pop();
      addLog(`${manager.name} 让 ${target.name} 继续工作：${target.currentTask}`, `M${currentDispatch}`);
      render();
      window.setTimeout(() => {
        target.status = "writing";
        target.pose = agents[targetId].pose === "sitting" ? "sitting" : "talking";
        target.x = target.home[0];
        target.y = target.home[1];
        target.progress = Math.min(98, target.progress + 14);
        manager.status = "done";
        manager.pose = "standing";
        manager.currentTask = "经理已完成派发，等待新交付";
        const artifact = `script/manager_followup_${currentDispatch}.md`;
        if (!artifacts.includes(artifact)) artifacts.push(artifact);
        target.currentTask = "经理派发后的继续写作中";
        addLog(`${target.name} 接收经理任务，回到工位继续工作`, `M${currentDispatch}`);
        render();
      }, 900);
    }

    function statusText(status) {
      const map = { idle: "待命", thinking: "思考", writing: "写作", reviewing: "审核", meeting: "沟通", done: "完成" };
      return map[status] || status;
    }

    function render() {
      stages.forEach((_, index) => document.getElementById(`stage-${index}`).classList.toggle("active", step >= 0 && events[Math.max(0, step)].stage === index));

      Object.entries(agentState).forEach(([id, agent]) => {
        const node = document.getElementById(id);
        node.style.setProperty("--x", agent.x);
        node.style.setProperty("--y", agent.y);
        node.style.setProperty("--p", agent.progress);
        const depth = 20 + Math.round(agent.y * 10) + (id === selectedAgent ? 220 : 0);
        node.style.zIndex = String(depth);
        node.className = `agent ${agent.status} ${id === selectedAgent ? "selected" : ""} ${agent.status === "meeting" ? "meeting moving" : ""} ${["thinking", "writing", "reviewing"].includes(agent.status) ? "working" : ""} ${id === selectedAgent ? "active-bubble" : ""}`;
        node.querySelector(".agent-sprite").src = sprites[agent.model][agent.pose] || sprites[agent.model].standing;
        node.querySelector(".status-pill").textContent = statusText(agent.status);
        node.querySelector(".work-badge span").textContent = statusText(agent.status);
      });

      const selected = agentState[selectedAgent];
      inspector.innerHTML = `
        <div class="stat-card"><strong>${selected.name}</strong><span>${selected.role} · ${selected.level}</span></div>
        <div class="stat-card"><strong>${statusText(selected.status)}</strong><span>${selected.currentTask || selected.task}</span><div class="progress"><div class="progress-fill" style="width:${selected.progress}%"></div></div><span>${selected.progress}% complete</span></div>
        <div class="stat-card"><strong>交付状态</strong><span>${selected.handoff || "尚未交付"}</span></div>
        <div class="stat-card manager-card"><strong>经理决策</strong><span>${managerDecision}</span><div class="manager-actions"><button id="assignSelectedBtn" type="button">经理让 TA 继续工作</button></div></div>
        <div class="stat-card"><strong>Memory Delta</strong><span>${selected.progress >= 80 ? "已沉淀为可复用经验" : "等待质量评估后写入"}</span></div>`;
      document.getElementById("assignSelectedBtn").addEventListener("click", () => managerDispatch(selectedAgent));

      artifactBox.innerHTML = artifacts.length ? artifacts.map(item => `<div class="artifact"><strong>${item.split("/").pop()}</strong><span>${item}</span></div>`).join("") : `<div class="artifact"><strong>等待产物</strong><span>Run workflow to create artifacts</span></div>`;
      issuesBox.innerHTML = issues.length ? issues.map(item => `<div class="issue-card"><strong>需要处理</strong><span>${item}</span></div>`).join("") : `<div class="issue-card"><strong>无阻塞</strong><span>等待 review agent 输入</span></div>`;
      managerQueueBox.innerHTML = managerQueue.length ? managerQueue.map(item => `<div class="artifact queue-item"><strong>${item.decision}</strong><span>${item.from} · ${item.payload}</span></div>`).join("") : `<div class="artifact queue-item"><strong>等待交付</strong><span>子 agent 完成后会进入经理队列</span></div>`;
      document.getElementById("metricStep").textContent = String(Math.max(0, step + 1));
      document.getElementById("metricDone").textContent = String(Object.values(agentState).filter(agent => agent.status === "done").length);
      document.getElementById("metricIssues").textContent = String(issues.length);
      document.getElementById("metricScore").textContent = score ? String(score) : "--";
    }

    init();
  </script>
</body>
</html>
