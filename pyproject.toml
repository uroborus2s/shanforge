[project]
name = "shanforge"
version = "0.2.0.dev0"
description = "Skill-first software factory rules and reusable agent workflows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.10.0",
  "PyYAML>=6.0.2",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
  ".factory",
  "skills/docx/scripts",
  "skills/pdf/scripts",
  "skills/ui-ux-pro-max/scripts",
  "skills/webapp-testing/examples",
  "skills/webapp-testing/scripts",
  "skills/xlsx/scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
files = ["skills"]
warn_unused_configs = true
pretty = true
