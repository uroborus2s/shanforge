[project]
name = "shanforge"
version = "0.1.0"
description = "CLI-first software factory workspace for Codex and Gemini CLI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-include = ["scripts/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
files = ["scripts/factory_core.py"]
warn_unused_configs = true
pretty = true
