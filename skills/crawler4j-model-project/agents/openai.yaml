interface:
  display_name: "Crawler4j Model Project"
  short_description: "Build and migrate crawler4j 0.4.0 core-native-v2 module projects through the SDK CLI, scanner, manifest lock, and host bridge"
  default_prompt: "Use $crawler4j-model-project when creating, migrating, debugging, packaging, installing, or reviewing a crawler4j `0.4.0` module project. Prefer `crawler4j module init`, `interface/component/workflow/page-action/data/candidate/cleanup/page create`, `manifest lock`, `check structure|release|full`, `package build|verify`, and `host devlink|install|debug config` before manual scaffolding. Treat `module.yaml` plus `.crawler4j/manifest.lock.json` as the formal module contract, keep runtime code on `crawler4j-contracts` only, and reject legacy surfaces such as `TaskScript`, `TaskFlow`, `module_runtime.py`, `env_selectors/`, `ui_extension`, and `config_schema.json`."
