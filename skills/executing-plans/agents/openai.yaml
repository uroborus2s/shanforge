interface:
  display_name: "执行实施计划"
  short_description: "在当前会话执行 written implementation plan，并保留 evidence、report、ledger 和状态回写。"
  default_prompt: "使用 $executing-plans：读取 .factory/workitems/<WORKITEM-ID>/plan.md 和 ledger，先批判性 review plan，再逐步执行未完成任务；每个任务写 evidence、report、review input、ledger 和 memory，完成后只回写 status、outputs、evidence 和 needs，不决定下一步 skill。"
