interface:
  display_name: "Stratix Service"
  short_description: "Use create-stratix and stratix forge commands to build Stratix services"
  default_prompt: "Use $stratix-service when building, refactoring, debugging, reviewing, or configuring a Stratix service, API, worker, sync app, gateway, plugin, or admin companion. First detect npm dist-tags and the project's installed @stratix/create, @stratix/forge, @stratix/core, and @stratix/database versions; then verify CLI capability with --help, list templates, and list presets before choosing commands. Use create-stratix for project/plugin creation and project-local pnpm exec stratix for commands. Choose the smallest matching preset/plugin set before writing code, do not use the removed tasks preset for new work, and require generated app config to be encrypted into STRATIX_SENSITIVE_CONFIG with STRATIX_ENCRYPTION_KEY. Mark production-ready only after fresh doctor, test, build, manifest, release gate, openapi, start, decrypt, and runtime injection checks all pass; if decrypt or runtime injection cannot be verified, mark the result blocked."
