interface:
  display_name: "Stratix Service"
  short_description: "Use create-stratix and stratix forge commands to build Stratix services"
  default_prompt: "Use $stratix-service when building, refactoring, debugging, reviewing, or configuring a Stratix 1.1.x service, API, worker, sync app, gateway, plugin, or admin companion. Prefer @stratix/create for project and plugin creation, @stratix/forge for project-local stratix commands, and choose the smallest matching preset/plugin set before writing code. Preserve controller -> service -> repository layering, treat @stratix/database as BaseRepository-first, do not use the removed tasks preset for new work, and handle STRATIX_SENSITIVE_CONFIG plus STRATIX_ENCRYPTION_KEY explicitly."
