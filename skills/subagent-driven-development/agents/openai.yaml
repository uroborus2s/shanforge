interface:
  display_name: "子代理驱动开发"
  short_description: "按 Shanforge work item plan 派发独立任务，生成 evidence、report、review input 和状态回写。"
  default_prompt: "使用 $subagent-driven-development 执行已批准的 work item plan：读取 .factory/workitems/<WORKITEM-ID>/plan.md、task-briefs 和 ledger，逐任务派发隔离实现，写入 evidence、reports、review input、ledger 和 memory；完成后只回写 status、outputs、evidence 和 needs，不决定下一步 skill。"
